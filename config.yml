# ===== ShoxCraft umumiy sozlamalari =====
boshlangich-pul: 1000
kunlik-mukofot: 250
maks-uy: 3
tpa-vaqt: 60          # soniya
spawn-himoya: 0      # ANARXIYA: 0 = hech qanday himoya yo'q. Xohlasangiz radius (blok) yozing
xush-kelibsiz: "&4&lSHOXCRAFT ANARXIYA &6- qoidalar yo'q, &e%oyinchi%&6! &7/yordam"
# ===== Tadbirlar (avtomatik eventlar) =====
tadbirlar:
  oraliq-daqiqa: 30          # har necha daqiqada tasodifiy tadbir boshlanadi
  royxat: [xazina, boss, konchi]
  radius: 2000               # tadbir joylari spawn dan shuncha blok ichida
  xazina-pul: 1500
  xazina-daqiqa: 10
  boss-jon: 400
  boss-daqiqa: 15
  konchi-daqiqa: 10
  mukofot: [2000, 1000, 500] # 1, 2, 3-o'rin pul mukofoti

# Rollar: /rol <o'yinchi> <rol>
# admin: true -> admin buyruqlari, fly: true -> /uchish
ranks:
  oyinchi:
    prefix: "&7[O'yinchi] "
    admin: false
    fly: false
  vip:
    prefix: "&6[VIP] "
    admin: false
    fly: true
  admin:
    prefix: "&c[Admin] "
    admin: true
    fly: true
  owner:
    prefix: "&4[Ega] "
    admin: true
    fly: true

